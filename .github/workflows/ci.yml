name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Python worker dependencies (CPU-only)
        run: pip install -r requirements.txt --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Install Node dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build (syntax check)
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build container image
        run: docker build -t latentforge:ci .

      - name: Smoke-test the container
        run: |
          docker run -d --name latentforge-ci -p 4173:4173 latentforge:ci
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:4173/health > /dev/null; then break; fi
            sleep 2
          done
          curl -sf http://127.0.0.1:4173/health
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:4173/ready > /dev/null; then break; fi
            sleep 2
          done
          curl -sf http://127.0.0.1:4173/ready
          curl -sf -X POST http://127.0.0.1:4173/api/experiment \
            -H 'content-type: application/json' \
            -d '{"backend":"recurrent","task":"1,0,1,1","reasoningBudget":4,"includeBudgetSweep":false}'
          docker logs latentforge-ci
          docker stop latentforge-ci
